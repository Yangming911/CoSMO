MappingConf: # Ablation: GCLIP argmax obstacle map (no conformal prediction)
  n_points: 600
  size: 60
  agent_radius: 0.2
  blur_kernel_size: 0.05
  obstacle_map_threshold: 0.4
  fully_explored_threshold: 0.2
  checked_map_threshold: 0.2
  depth_factor: 0.01
  gradient_factor: 0.2
  optimal_object_distance: 1.0
  optimal_object_factor: 1.5
  obstacle_min: -0.6
  obstacle_max: 0.5
  filter_stairs: True
  floor_level: -0.88
  floor_threshold: -1.1
  clip_model_type: convnext
  use_gclip_for_obstacles: True
  use_clip_semantic_nav_map: False
  clip_semantic_sim_threshold: 0.0
  use_yolo_obstacle_map: False
  yolo_window_size: 50
  # The shared CLIPCPObstacleMap class is only used as an argmax-map
  # container here; CP/OACP calibration is disabled by this switch.
  use_clip_cp_obstacle_map: False
  use_clip_argmax_obstacle_map: True
  clip_cp_use_margin: False
  clip_cp_use_oacp: False
  clip_cp_target_coverage: 0.9
  clip_cp_max_seeds_per_label: 20
  clip_cp_temporal_persistence: 0
  clip_cp_detection_gate: True
  clip_cp_threshold: 0.48
  clip_cp_window_size: 200
  clip_cp_gamma: 0.05
  clip_cp_safety_radius_add: 1
  clip_cp_step_guard: True
  clip_cp_step_guard_lookahead: 3
  clip_cp_use_mp3d_labels: True
  clip_cp_argmax_confidence: 0.25
  use_yolo_cp_obstacle_map: False
  yolo_cp_threshold: 0.5
  yolo_cp_target_coverage: 0.9
  yolo_cp_window_size: 200
  yolo_cp_frustum_max_depth: 5.0
